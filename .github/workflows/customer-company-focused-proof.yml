name: Customer Company admission focused proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/customer-company-focused-proof.yml'
      - 'scripts/customer-company-focused-manifest.json'
      - 'scripts/verify_customer_company_focus.py'
      - 'scripts/test_customer_company_focus.py'
      - 'scripts/capture_customer_default_focus_resources.py'
      - 'scripts/test_customer_default_focus_resources.py'
      - 'Legacy.Maliev.CustomerService.Application/Interfaces/ICustomerBoundaries.cs'
      - 'Legacy.Maliev.CustomerService.Application/Services/CustomerApplicationService.cs'
      - 'Legacy.Maliev.CustomerService.Data/CustomerRepository.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerDefaultPageHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Data/CustomerPostgresMigrationTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Data/CustomerCrudPostgresTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyPersistenceHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyLiteralNameHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyPrimitiveNameHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Application/Models/CustomerRelationEdits.cs'
      - 'Legacy.Maliev.CustomerService.Application/Models/CustomerModels.cs'
      - 'Legacy.Maliev.CustomerService.Application/Models/CompanyNameLengthAttribute.cs'
      - 'Legacy.Maliev.CustomerService.Application/Models/CompanyNameJsonConverter.cs'
      - 'Legacy.Maliev.CustomerService.Application/Models/OrdinaryCompanyNameJsonConverter.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyOrdinaryPrimitiveHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyOrdinaryPrimitiveReferenceTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Legacy.Maliev.CustomerService.Tests.csproj'
      - 'docs/company-ordinary-primitive-source-compatibility-20261011.md'
      - 'Legacy.Maliev.CustomerService.Api/Controllers/CustomerRelationsController.cs'
      - 'Legacy.Maliev.CustomerService.Api/Controllers/CompaniesController.cs'
      - 'Legacy.Maliev.CustomerService.Api/Program.cs'
      - 'Legacy.Maliev.CustomerService.Api/OrdinaryCompanyMvcJsonMetadata.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyOrdinaryMvcMetadataControls.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyOrdinaryDuplicateNullReferenceTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyOrdinaryDuplicateNullHttpTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyOrdinaryTaxRegistrarReferenceTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyOrdinaryTaxRegistrarMetadataTests.cs'
      - 'docs/company-ordinary-tax-registrar-null-mvc-compatibility-20261011.md'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyTaxRegistrarPrimitiveOracleTests.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CompanyTaxRegistrarPrimitiveStorageTests.cs'
      - 'docs/company-paired-field-primitive-proof-only-20261011.md'
      - 'Legacy.Maliev.CustomerService.Api/OrdinaryCompanyFieldPrimitiveJsonConverter.cs'
      - 'Legacy.Maliev.CustomerService.Tests/Controllers/CustomerCompanyFieldPrimitiveHttpTests.cs'
      - 'docs/company-tax-registrar-primitive-mvc-20261011.md'
      - 'docs/company-ordinary-duplicate-null-mvc-compatibility-20261011.md'

permissions:
  contents: read

concurrency:
  group: customer-company-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - name: Check out exact Customer PR tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out frozen Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: c40a7f82cea347b949444dcd7fb730f2b8dc3c0e
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out frozen Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up existing SDK family
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Observe initial isolated focused resources
        run: timeout --signal=TERM --kill-after=5s 35s python3 -B scripts/capture_customer_default_focus_resources.py initial
      - name: Run pure focused evidence parser controls
        run: |
          python3 -B scripts/test_customer_company_focus.py
          python3 -B scripts/test_customer_default_focus_resources.py
      - name: Admitted focused restore
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          mkdir -p runner-default-focused
          python3 -B scripts/verify_customer_company_focus.py guard 2>&1 | tee runner-default-focused/restore-admission.log
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s dotnet restore Legacy.Maliev.CustomerService.slnx
      - name: Admitted focused Release build
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          mkdir -p runner-default-focused
          python3 -B scripts/verify_customer_company_focus.py guard 2>&1 | tee runner-default-focused/build-admission.log
          mkdir -p runner-default-focused
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s dotnet build Legacy.Maliev.CustomerService.slnx -c Release --no-restore -warnaserror -p:UseSharedCompilation=false | tee runner-default-focused/build.log
      - name: Admitted exact30 Company focused cases
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          mkdir -p runner-default-focused
          python3 -B scripts/verify_customer_company_focus.py guard 2>&1 | tee runner-default-focused/test-admission.log
          filter=$(python3 -c 'import json;print(json.load(open("scripts/customer-company-focused-manifest.json"))["filter"])')
          timeout --signal=TERM --kill-after=5s 600s dotnet test Legacy.Maliev.CustomerService.slnx -c Release --no-build --no-restore --filter "$filter" --logger trx --results-directory runner-default-focused
          python3 -B scripts/verify_customer_company_focus.py verify
      - name: Observe terminal focused resource release
        if: always()
        run: timeout --signal=TERM --kill-after=5s 35s python3 -B scripts/capture_customer_default_focus_resources.py terminal
      - name: Preserve original focused evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: customer-company-focused-${{ github.sha }}
          path: runner-default-focused
          if-no-files-found: error
          retention-days: 7
