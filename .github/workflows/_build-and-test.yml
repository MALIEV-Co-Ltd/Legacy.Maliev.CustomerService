name: Build and test

on:
  workflow_call:
    inputs:
      customer-consumer-custody:
        description: Original admitted consumer owner receipt path; empty keeps ordinary CI unchanged
        type: string
        required: false
        default: ''
      customer-consumer-custody-sha256:
        description: Independently trusted original consumer custody raw SHA256
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    steps:
      - name: Check out CustomerService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: c40a7f82cea347b949444dcd7fb730f2b8dc3c0e
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Guard optional contact focused SDK setup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runner-optional-contact-focused
          mkdir runner-optional-contact-focused
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/controls-admission.log
          (ulimit -v 262144; timeout --signal=TERM --kill-after=5s 60s python3 -B scripts/test_customer_optional_contact_focus.py) 2>&1 | tee runner-optional-contact-focused/controls.log
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/sdk-admission.log
      - name: Set up optional contact focused SDK
        timeout-minutes: 4
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore optional contact focused baseline
        timeout-minutes: 4
        shell: bash
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/restore-admission.log
          timeout --signal=TERM --kill-after=5s 180s dotnet restore Legacy.Maliev.CustomerService.slnx -p:UseLocalMalievDependencies=true 2>&1 | tee runner-optional-contact-focused/restore.log
      - name: Build optional contact focused Release baseline
        timeout-minutes: 4
        shell: bash
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/build-admission.log
          timeout --signal=TERM --kill-after=5s 180s dotnet build Legacy.Maliev.CustomerService.slnx -p:UseLocalMalievDependencies=true -c Release --no-restore -warnaserror -p:UseSharedCompilation=false 2>&1 | tee runner-optional-contact-focused/build.log
      - name: Run exact ten optional contact boundary facts
        timeout-minutes: 10
        shell: bash
        env:
          GITHUB_ACTIONS: 'false'
          VSTestCollect: ''
          VSTestResultsDirectory: '${{ github.workspace }}/runner-optional-contact-boundary/results'
          CUSTOMER_FOCUSED_SOURCE_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_customer_optional_contact_boundary_focus.py guard
          test ! -e runner-optional-contact-boundary
          mkdir runner-optional-contact-boundary
          (ulimit -v 262144; timeout --signal=TERM --kill-after=5s 60s python3 -B scripts/test_customer_optional_contact_boundary_focus.py) 2>&1 | tee runner-optional-contact-boundary/controls.log
          python3 -B scripts/verify_customer_optional_contact_boundary_focus.py guard
          python3 -B scripts/verify_customer_optional_contact_boundary_focus.py begin
          set +e
          timeout --signal=TERM --kill-after=5s 540s dotnet test Legacy.Maliev.CustomerService.slnx -p:UseLocalMalievDependencies=true -c Release --no-build --no-restore --filter "FullyQualifiedName~Legacy.Maliev.CustomerService.Tests.Controllers.CustomerOptionalContactMvcBoundaryTests" --logger trx --results-directory runner-optional-contact-boundary/results 2>&1 | tee runner-optional-contact-boundary/test.log
          status=("${PIPESTATUS[@]}")
          set -e
          python3 -B scripts/verify_customer_optional_contact_boundary_focus.py verify --test-exit "${status[0]}" --tee-exit "${status[1]}"
      - name: Run exact two optional contact comparison cases
        timeout-minutes: 10
        shell: bash
        env:
          GITHUB_ACTIONS: 'false'
          VSTestCollect: ''
          VSTestResultsDirectory: '${{ github.workspace }}/runner-optional-contact-focused/results'
          CUSTOMER_FOCUSED_SOURCE_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/test-admission.log
          python3 -B scripts/verify_customer_optional_contact_focus.py begin
          set +e
          timeout --signal=TERM --kill-after=5s 540s dotnet test Legacy.Maliev.CustomerService.slnx -p:UseLocalMalievDependencies=true -c Release --no-build --no-restore --filter "FullyQualifiedName=Legacy.Maliev.CustomerService.Tests.Controllers.CustomerNameLiteralHttpTests.SourceOptionalContact_OrdinaryCreateAndUpdateComparePinnedReference" --logger trx --results-directory runner-optional-contact-focused/results 2>&1 | tee runner-optional-contact-focused/test.log
          status=("${PIPESTATUS[@]}")
          set -e
          python3 -B scripts/verify_customer_optional_contact_focus.py verify --test-exit "${status[0]}" --tee-exit "${status[1]}"
          python3 -B scripts/verify_customer_optional_contact_focus.py guard 2>&1 | tee runner-optional-contact-focused/full-admission.log
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e5732037fe94b7ed6e5be2cd4c23dbf6ef5e2617
        with:
          solution: Legacy.Maliev.CustomerService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Admitted ordinary Address primitive focused regressions
        timeout-minutes: 10
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          python3 -B scripts/test_customer_address_focus.py
          python3 -B scripts/verify_customer_address_focus.py guard
          timeout --signal=TERM --kill-after=5s 600s dotnet test Legacy.Maliev.CustomerService.slnx -c Release --no-build --no-restore --filter "FullyQualifiedName~CustomerAddressLiteralLineHttpTests|FullyQualifiedName~OrdinaryAddressPrimitiveMetadataTests" --logger trx --results-directory runner-address-focused
          python3 -B scripts/verify_customer_address_focus.py verify
      - name: Run exact separately admitted Customer consumer phases
        if: inputs.customer-consumer-custody != ''
        timeout-minutes: 30
        env:
          CUSTOMER_CONSUMER_CUSTODY: ${{ inputs.customer-consumer-custody }}
          CUSTOMER_CONSUMER_CUSTODY_SHA256: ${{ inputs.customer-consumer-custody-sha256 }}
        run: |
          timeout --signal=TERM --kill-after=5s 1800s python3 -B scripts/kernel_root_route.py consumer-phases --packet scripts/customer-kernel-packet --source-directory /work/customer-source --consumer-custody "$CUSTOMER_CONSUMER_CUSTODY" --consumer-custody-sha256 "$CUSTOMER_CONSUMER_CUSTODY_SHA256" --output "$RUNNER_TEMP/customer-consumer-phases"
      - name: Validate safe scaffold orchestration
        shell: pwsh
        run: ./tooling/Test-CustomerScaffoldContract.ps1 -EvidencePath ./runner-results/customer-scaffold-orchestration.json
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-validation-${{ github.sha }}
          path: |
            runner-results
            runner-address-focused
            runner-optional-contact-focused
            runner-optional-contact-boundary
            ${{ runner.temp }}/customer-consumer-phases
          if-no-files-found: warn
          retention-days: 7
